<!DOCTYPE html>
<html>
<head>
    <title>Scoreboard Projector</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>body { font-family: sans-serif; font-size: 24px; padding: 2rem; }</style>
</head>
<body>
    <h1>Idiom Scavenger Hunt</h1>
    <button onclick="resetGame()" style="margin-top: 20px; padding: 10px 20px; background: #dc2626; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Wipe Leaderboard</button>
    <div style="display: flex; gap: 50px;">
        <div>
            <h3>Scan to Join:</h3>
            <div id="qr"></div>
        </div>
        <div>
            <h3>Leaderboard</h3>
            <ul id="leaderboard"></ul>
        </div>
    </div>

<script>
    function resetGame() {
    if(confirm("Are you sure you want to wipe all scores?")) {
        db.ref('players').remove();
    }
}
    const firebaseConfig = {
  apiKey: "AIzaSyAAFeZuc_OGv-ECp-Ur6VsVh_HI51JcsYA",
  authDomain: "idiom-hunt.firebaseapp.com",
  databaseURL: "https://idiom-hunt-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "idiom-hunt",
  storageBucket: "idiom-hunt.firebasestorage.app",
  messagingSenderId: "511512820618",
  appId: "1:511512820618:web:e3e8fe5b90dd9ba126a673",
  measurementId: "G-D75LVWF81M"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Generate QR code pointing to your player file (host this on GitHub Pages)
    new QRCode(document.getElementById("qr"), "https://TheOneWhoRoams.github.io/Idiom-Scavenger-Hunt-Educational-Web-App-for-ESL-/");

    // Listen for score updates
    db.ref('players').on('value', (snapshot) => {
        const data = snapshot.val();
        const list = document.getElementById('leaderboard');
        list.innerHTML = '';
        if(!data) return;

        // Sort by score descending
        Object.values(data)
            .sort((a, b) => b.score - a.score)
            .forEach(player => {
                list.innerHTML += `<li>${player.name}: ${player.score} pts</li>`;
            });
    });
</script>
</body>
</html>
