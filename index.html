<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player Scanner</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>body { font-family: sans-serif; text-align: center; margin-top: 20px; }</style>
</head>
<body>
    <div id="login">
        <input type="text" id="playerName" placeholder="Enter your name" style="font-size: 20px;">
        <button onclick="startGame()" style="font-size: 20px;">Join</button>
    </div>

    <div id="game" style="display: none;">
        <h2>Find the match for:</h2>
        <h1 id="assigned-phrase" style="color: blue;"></h1>
        <div id="reader" style="width: 300px; margin: 0 auto;"></div>
        <h2 id="status"></h2>
    </div>

<script>
  {
    const firebaseConfig = {   apiKey: "AIzaSyAAFeZuc_OGv-ECp-Ur6VsVh_HI51JcsYA",
  authDomain: "idiom-hunt.firebaseapp.com",
  databaseURL: "https://idiom-hunt-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "idiom-hunt",
  storageBucket: "idiom-hunt.firebasestorage.app",
  messagingSenderId: "511512820618",
  appId: "1:511512820618:web:e3e8fe5b90dd9ba126a673",
  measurementId: "G-D75LVWF81M" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
  }
    ;
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const pairs = {
        "Bite the": "bullet", "Play devil's": "advocate", "Throw in": "the towel",
        "Spill the": "beans", "Cut to the": "chase", "Kick the": "bucket",
        "Beat a dead": "horse", "A blessing in": "disguise", "Burn the midnight": "oil",
        "Jump on the": "bandwagon", "Let the cat out of": "the bag", "Make a long story": "short",
        "Miss the": "boat", "Once in a blue": "moon", "Pull someone's": "leg",
        "Under the": "weather", "Wrap your head": "around it", "Break the": "ice",
        "Steal someone's": "thunder", "Hit the nail on": "the head"
    };
    
    let myName = "";
    let myScore = 0;
    let myCurrentPhrase = "";
    let html5QrcodeScanner;
    let isProcessing = false; // The execution lock

    function startGame() {
        myName = document.getElementById('playerName').value;
        if (!myName) return;

        document.getElementById('login').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        
        db.ref('players/' + myName).set({ name: myName, score: 0 });
        
        assignNewPhrase();
        startScanner();
    }

    function assignNewPhrase() {
        const phrases = Object.keys(pairs);
        let newPhrase = myCurrentPhrase;
        
        // Force the script to pick a different phrase
        while (newPhrase === myCurrentPhrase) {
            newPhrase = phrases[Math.floor(Math.random() * phrases.length)];
        }
        
        myCurrentPhrase = newPhrase;
        document.getElementById('assigned-phrase').innerText = myCurrentPhrase;
    }

    function startScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} });
        html5QrcodeScanner.render(onScanSuccess);
    }

    function onScanSuccess(decodedText) {
        // If we are already processing a scan, ignore any new frames
        if (isProcessing) return;
        
        isProcessing = true; // Lock the execution
        html5QrcodeScanner.pause();

        const correctTarget = pairs[myCurrentPhrase];

        if (decodedText.toLowerCase() === correctTarget.toLowerCase()) {
            document.getElementById('status').innerText = "CORRECT!";
            document.getElementById('status').style.color = "green";
            myScore++;
            db.ref('players/' + myName).update({ score: myScore });
            
            setTimeout(() => {
                document.getElementById('status').innerText = "";
                assignNewPhrase();
                isProcessing = false; // Unlock execution
                html5QrcodeScanner.resume();
            }, 2000);
        } else {
            document.getElementById('status').innerText = "WRONG. That was " + decodedText;
            document.getElementById('status').style.color = "red";
            
            setTimeout(() => {
                document.getElementById('status').innerText = "";
                isProcessing = false; // Unlock execution
                html5QrcodeScanner.resume();
            }, 2000);
           }
    }

</script>
</body>
</html>
